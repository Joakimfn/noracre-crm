name: Outbound integration review
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/outbound-review.yml'
permissions:
  contents: read
concurrency:
  group: outbound-review-${{ github.ref }}
  cancel-in-progress: true
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm ci --no-audit --no-fund
      - name: Archive tracked source and installed test dependencies
        run: |
          git archive --format=zip HEAD -o outbound-source.zip
          tar -czf outbound-dependencies.tgz node_modules
      - uses: actions/upload-artifact@v7
        with:
          name: outbound-source-review
          path: |
            outbound-source.zip
            outbound-dependencies.tgz
          compression-level: 0
          retention-days: 1
