name: Outbound integration review
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/outbound-review.yml'
      - 'components/outbound*'
      - 'lib/outbound*'
      - 'app/api/outbound/**'
      - 'tests/outbound*'
      - 'drizzle/0030*'
      - 'drizzle/0031*'
permissions:
  contents: read
concurrency:
  group: outbound-review-${{ github.ref }}
  cancel-in-progress: true
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Archive tracked source only
        run: git archive --format=zip HEAD -o outbound-source.zip
      - uses: actions/upload-artifact@v7
        with:
          name: outbound-source-review
          path: outbound-source.zip
          retention-days: 1
