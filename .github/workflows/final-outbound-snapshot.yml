name: Final outbound review snapshot
on:
  pull_request:
    paths: ['.github/workflows/final-outbound-snapshot.yml']
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
      - name: Snapshot tracked source only
        run: git archive --format=zip HEAD -o source.zip
      - uses: actions/upload-artifact@v7
        with:
          name: final-outbound-source
          path: source.zip
          retention-days: 1
