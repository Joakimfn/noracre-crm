name: Noracre build and tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: noracre-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Build production worker
        run: npm run build
      - name: Run regression tests
        run: node --test --test-concurrency=2 tests/*.test.mjs
      - name: Save verified build
        uses: actions/upload-artifact@v7
        with:
          name: noracre-verified-build
          path: dist/
          include-hidden-files: true
          retention-days: 1
